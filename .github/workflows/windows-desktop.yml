name: Windows Desktop EXE

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'cloud-config.js'
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

concurrency:
  group: pixelforge-windows-releases
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out PixelForge
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Electron dependencies
        run: npm install --no-audit --no-fund

      - name: Set unique Windows release version
        run: npm version 0.1.${{ github.run_number }} --no-git-tag-version

      - name: Build Windows installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PixelForge-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish auto-update release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: PixelForge Studio v0.1.${{ github.run_number }} — Windows
          prerelease: false
          make_latest: true
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          body: |
            PixelForge Studio Windows update v0.1.${{ github.run_number }}.
            Download the EXE below to install PixelForge, or use the app's Updates menu.
            After installing the updater-enabled version, future versions can be downloaded
            automatically from GitHub Releases and installed by restarting PixelForge.
            Windows SmartScreen may warn because the installer is not yet code signed.
            Google desktop sign-in requires pixelforge://auth/callback in Supabase Redirect URLs.
